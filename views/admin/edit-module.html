<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><%= pageTitle %></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold" href="/admin">FocusLearn Admin</a>
  <div>
    <a href="/admin/modules" class="btn btn-outline-light btn-sm me-2">Back to Topics</a>
    <a href="/admin" class="btn btn-outline-light btn-sm">Dashboard</a>
  </div>
</nav>

<div class="container py-4">
  <div class="card shadow-sm border-0 p-4" style="max-width: 850px; margin: 0 auto;">
    <h3 class="fw-bold mb-3">Edit Topic / Learning Module</h3>

    <% if (error) { %>
      <div class="alert alert-danger"><%= error %></div>
    <% } %>

    <form action="/admin/modules/<%= moduleDoc._id %>?_method=PUT" method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Course</label>
          <input type="text" class="form-control" value="[<%= moduleDoc.courseId ? moduleDoc.courseId.code : '' %>] <%= moduleDoc.courseId ? moduleDoc.courseId.title : '' %>" disabled>
        </div>

        <div class="col-md-3">
          <label class="form-label fw-semibold">Module Number</label>
          <input type="number" name="moduleNumber" class="form-control" value="<%= moduleDoc.moduleNumber %>" min="1" required>
        </div>

        <div class="col-md-3">
          <label class="form-label fw-semibold">Estimated Duration (Mins)</label>
          <input type="number" name="estimatedMinutes" class="form-control" value="<%= moduleDoc.estimatedMinutes || 35 %>" min="5" required>
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold">Topic Title</label>
          <input type="text" name="title" class="form-control" value="<%= moduleDoc.title %>" required>
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold">Summary</label>
          <textarea name="summary" class="form-control" rows="2" required><%= moduleDoc.summary %></textarea>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">PDF Material Path or URL</label>
          <input type="text" name="pdfUrl" class="form-control" value="<%= moduleDoc.pdfUrl || '' %>">
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Key Concepts (Comma-separated)</label>
          <input type="text" name="keyConcepts" class="form-control" value="<%= (moduleDoc.keyConcepts && moduleDoc.keyConcepts.length) ? moduleDoc.keyConcepts.join(', ') : '' %>">
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold">Detailed Lesson Content</label>
          <textarea name="content" class="form-control" rows="6"><%= moduleDoc.content %></textarea>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
          <i class="bi bi-save me-1"></i> Update Topic
        </button>
        <a href="/admin/modules?courseId=<%= moduleDoc.courseId ? moduleDoc.courseId._id : '' %>" class="btn btn-secondary px-4 py-2">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>

</body>
</html>
