<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><%= pageTitle %></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold" href="/admin">
    <i class="bi bi-shield-lock-fill text-warning me-2"></i>FocusLearn Admin
  </a>
  <div>
    <a href="/admin/materials" class="btn btn-outline-light btn-sm me-2">Back to Materials</a>
    <a href="/admin" class="btn btn-outline-light btn-sm">Dashboard</a>
  </div>
</nav>

<div class="container py-4">
  <div class="card shadow-sm border-0 p-4" style="max-width: 850px; margin: 0 auto;">
    <h3 class="fw-bold mb-3">Edit Study Material</h3>

    <% if (error) { %>
      <div class="alert alert-danger"><%= error %></div>
    <% } %>

    <form action="/admin/materials/<%= material._id %>?_method=PUT" method="POST" enctype="multipart/form-data">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Title</label>
          <input name="title" class="form-control" value="<%= material.title %>" required>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Subject / Course</label>
          <select name="courseId" class="form-select" required>
            <% courses.forEach(course => { %>
              <option value="<%= course._id %>"
                <%= material.courseId && material.courseId.toString() === course._id.toString() ? 'selected' : '' %>>
                [<%= course.code %>] <%= course.title %>
              </option>
            <% }) %>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Assign to Topic / Module (optional)</label>
          <select name="moduleId" class="form-select">
            <option value="">Whole course / not topic-specific</option>
            <% modules.forEach(module => { %>
              <option value="<%= module._id %>" <%= material.moduleId && material.moduleId.toString() === module._id.toString() ? 'selected' : '' %>>
                Module <%= module.moduleNumber %>: <%= module.title %>
              </option>
            <% }) %>
          </select>
        </div>

        <div class="col-md-3">
          <label class="form-label fw-semibold">Topic Number (optional)</label>
          <input type="number" min="1" name="topicNumber" class="form-control" value="<%= material.topicNumber || '' %>">
        </div>

        <div class="col-md-3">
          <label class="form-label fw-semibold">Material Type</label>
          <select name="materialType" id="materialType" class="form-select fw-semibold">
            <% [
              { val: 'PDF', label: '📄 PDF Document' },
              { val: 'PPT', label: '📊 PowerPoint (PPT/PPTX)' },
              { val: 'Video', label: '▶ YouTube Video' },
              { val: 'Link', label: '🔗 External Link' },
              { val: 'Text', label: '📝 Written Notes' }
            ].forEach(t => { %>
              <option value="<%= t.val %>" <%= material.materialType === t.val ? 'selected' : '' %>>
                <%= t.label %>
              </option>
            <% }) %>
          </select>
        </div>

        <div class="col-12">
          <label class="form-label fw-semibold">Description</label>
          <textarea name="description" class="form-control" rows="2"><%= material.description %></textarea>
        </div>

        <!-- Optional Replace File Field (PDF / PPT) -->
        <div class="col-md-6" id="fileUploadContainer">
          <label class="form-label fw-semibold" id="fileUploadLabel">Replace Uploaded File</label>
          <input type="file" name="materialFile" id="materialFile" class="form-control" accept=".pdf,.ppt,.pptx">
          <div class="form-text small" id="fileUploadHint">Leave blank to keep current file.</div>
        </div>

        <div class="col-md-6" id="urlField">
          <label class="form-label fw-semibold" id="urlFieldLabel">Material Path / URL</label>
          <input name="materialUrl" id="materialUrl" class="form-control" value="<%= material.materialUrl %>">
          <div class="form-text small" id="urlFieldHint">Points to an uploaded path or web URL.</div>
        </div>

        <div class="col-12" id="contentField" style="display:none">
          <label class="form-label fw-semibold">Written Notes / Content</label>
          <textarea name="content" id="content" class="form-control" rows="6"><%= material.content %></textarea>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
          <i class="bi bi-save me-1"></i> Save Changes
        </button>
        <a href="/admin/materials" class="btn btn-secondary px-4 py-2">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
  const typeSelect = document.getElementById('materialType');
  const urlField = document.getElementById('urlField');
  const contentField = document.getElementById('contentField');
  const fileUploadContainer = document.getElementById('fileUploadContainer');
  const materialUrl = document.getElementById('materialUrl');
  const content = document.getElementById('content');
  const fileUploadLabel = document.getElementById('fileUploadLabel');
  const urlFieldLabel = document.getElementById('urlFieldLabel');
  const urlFieldHint = document.getElementById('urlFieldHint');

  function updateFields() {
    const type = typeSelect.value;
    const isText = (type === 'Text');
    const isVideo = (type === 'Video');
    const isPPT = (type === 'PPT');
    const isPDF = (type === 'PDF');

    contentField.style.display = isText ? 'block' : 'none';
    content.required = isText;

    if (isText) {
      fileUploadContainer.style.display = 'none';
      urlField.style.display = 'none';
      return;
    }

    if (isVideo) {
      fileUploadContainer.style.display = 'none';
      urlField.style.display = 'block';
      urlFieldLabel.innerHTML = 'YouTube Video URL <span class="text-danger">*</span>';
      urlFieldHint.textContent = 'Paste YouTube URL (e.g. https://www.youtube.com/watch?v=...)';
      return;
    }

    if (isPPT) {
      fileUploadContainer.style.display = 'block';
      urlField.style.display = 'block';
      fileUploadLabel.textContent = 'Replace PowerPoint (.ppt, .pptx)';
      urlFieldLabel.textContent = 'PowerPoint Path or URL';
      urlFieldHint.textContent = 'e.g. /materials/presentation.pptx';
      return;
    }

    if (isPDF) {
      fileUploadContainer.style.display = 'block';
      urlField.style.display = 'block';
      fileUploadLabel.textContent = 'Replace PDF (.pdf)';
      urlFieldLabel.textContent = 'PDF Path or URL';
      urlFieldHint.textContent = 'e.g. /materials/document.pdf';
      return;
    }

    // Link
    fileUploadContainer.style.display = 'none';
    urlField.style.display = 'block';
    urlFieldLabel.innerHTML = 'External Web URL';
  }

  typeSelect.addEventListener('change', updateFields);
  updateFields();
</script>

</body>
</html>
