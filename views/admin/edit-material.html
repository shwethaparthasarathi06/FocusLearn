<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><%= pageTitle %></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="card shadow-sm p-4">
    <h3>Edit Study Material</h3>

    <% if (error) { %>
      <div class="alert alert-danger"><%= error %></div>
    <% } %>

    <form action="/admin/materials/<%= material._id %>?_method=PUT"
          method="POST">

      <label class="form-label">Title</label>
      <input name="title" class="form-control mb-3"
             value="<%= material.title %>" required>

      <label class="form-label">Description</label>
      <textarea name="description" class="form-control mb-3"><%= material.description %></textarea>

      <label class="form-label">Subject</label>
      <select name="courseId" class="form-select mb-3" required>
        <% courses.forEach(course => { %>
          <option value="<%= course._id %>"
            <%= material.courseId.toString() === course._id.toString() ? 'selected' : '' %>>
            <%= course.title %>
          </option>
        <% }) %>
      </select>

      <label class="form-label">Assign to Topic / Module (optional)</label>
      <select name="moduleId" class="form-select mb-3">
        <option value="">Whole course / not topic-specific</option>
        <% modules.forEach(module => { %>
          <option value="<%= module._id %>" <%= material.moduleId && material.moduleId.toString() === module._id.toString() ? 'selected' : '' %>><%= module.title %></option>
        <% }) %>
      </select>
      <label class="form-label">Topic number (optional)</label>
      <input type="number" min="1" name="topicNumber" class="form-control mb-3" value="<%= material.topicNumber || '' %>">

      <label class="form-label">Material Type</label>
      <select name="materialType" id="materialType"
              class="form-select mb-3">
        <% ['PDF', 'Video', 'Link', 'Text'].forEach(type => { %>
          <option value="<%= type %>"
            <%= material.materialType === type ? 'selected' : '' %>>
            <%= type %>
          </option>
        <% }) %>
      </select>

      <div id="urlField">
        <label class="form-label">Material URL</label>
        <input name="materialUrl" id="materialUrl"
               class="form-control mb-3"
               value="<%= material.materialUrl %>">
      </div>

      <div id="contentField">
        <label class="form-label">Written Material</label>
        <textarea name="content" id="content"
                  class="form-control mb-3" rows="7"><%= material.content %></textarea>
      </div>

      <button class="btn btn-primary">Save Changes</button>
      <a href="/admin/materials" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>

<script>
  const typeSelect = document.getElementById('materialType');
  const urlField = document.getElementById('urlField');
  const contentField = document.getElementById('contentField');
  const materialUrl = document.getElementById('materialUrl');
  const content = document.getElementById('content');

  function updateFields() {
    const isText = typeSelect.value === 'Text';

    urlField.style.display = isText ? 'none' : 'block';
    contentField.style.display = isText ? 'block' : 'none';

    materialUrl.required = !isText;
    content.required = isText;
  }

  typeSelect.addEventListener('change', updateFields);
  updateFields();
</script>

</body>
</html>
