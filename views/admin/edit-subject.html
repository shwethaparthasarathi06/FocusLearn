<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><%= pageTitle %></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="card shadow-sm p-4">
    <h3>Edit Subject</h3>

    <% if (error) { %>
      <div class="alert alert-danger"><%= error %></div>
    <% } %>

    <form action="/admin/subjects/<%= course._id %>?_method=PUT"
          method="POST">

      <label class="form-label">Subject Name</label>
      <input name="title" class="form-control mb-3"
             value="<%= course.title %>" required>

      <label class="form-label">Subject Code</label>
      <input name="code" class="form-control mb-3"
             value="<%= course.code %>" required>

      <label class="form-label">Description</label>
      <textarea name="description" class="form-control mb-3"
                required><%= course.description %></textarea>

      <label class="form-label">Image URL or Path</label>
      <input name="image" class="form-control mb-3"
             value="<%= course.image %>" required>

      <label class="form-label">Duration (Hours)</label>
      <input type="number" name="durationHours"
             class="form-control mb-3"
             value="<%= course.durationHours %>" min="0">

      <label class="form-label">Display Order</label>
      <input type="number" name="order"
             class="form-control mb-3"
             value="<%= course.order %>" min="1">

      <button class="btn btn-primary">Save Changes</button>
      <a href="/admin/subjects" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</div>

</body>
</html>
