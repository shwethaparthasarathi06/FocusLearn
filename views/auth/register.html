<%- include('../partials/header.html') %>
    <%- include('../partials/sidebar.html') %>

        <div class="main-content">
            <%- include('../partials/flash.html') %>

                <div class="auth-wrapper">
                    <div class="auth-card">
                        <div class="auth-header">
                            <div class="auth-icon-circle">
                                <i class="bi bi-person-plus"></i>
                            </div>
                            <h2>Create Account</h2>
                            <p class="auth-subtitle">Register as a student to track your study sessions and quiz
                                progress.</p>
                        </div>

                        <form action="/auth/register" method="POST">
                            <div class="mb-3">
                                <label for="name" class="form-label auth-form-label">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="name" name="name"
                                        value="<%= typeof name !== 'undefined' ? name : '' %>" required
                                        placeholder="Enter your name">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label auth-form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" name="email"
                                        value="<%= typeof email !== 'undefined' ? email : '' %>" required
                                        placeholder="name@gmail.com">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label auth-form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" required
                                        placeholder="At least 6 characters">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label auth-form-label">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                                    <input type="password" class="form-control" id="confirmPassword"
                                        name="confirmPassword" required placeholder="Re-type your password">
                                </div>
                            </div>

                            <button type="submit" class="btn-focus btn-auth-submit">
                                <i class="bi bi-check-lg me-1"></i> Register as Student
                            </button>
                        </form>

                        <div class="auth-switch-box">
                            Already have an account? <a href="/auth/login" class="auth-link">Login here</a>
                        </div>
                    </div>
                </div>
        </div>

        <%- include('../partials/footer.html') %>
