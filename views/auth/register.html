<%- include('../partials/header.html') %>
<%- include('../partials/sidebar.html') %>

<div class="main-content">
    <%- include('../partials/flash.html') %>

    <div class="auth-wrapper">
        <div class="auth-card register-card">
            <div class="auth-header">
                <h2>Create Your Account</h2>
                <p>Join FocusLearn and start tracking your academic progress</p>
            </div>

            <form action="/auth/register" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label auth-form-label">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="name" name="name"
                            value="<%= typeof name !== 'undefined' ? name : '' %>" required
                            placeholder="e.g. Alex Morgan">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label auth-form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email"
                            value="<%= typeof email !== 'undefined' ? email : '' %>" required
                            placeholder="e.g. alex@university.edu">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="password" class="form-label auth-form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required
                                    placeholder="At least 6 characters">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label auth-form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                                <input type="password" class="form-control" id="confirmPassword"
                                    name="confirmPassword" required placeholder="Re-type your password">
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-hero-primary w-100 py-2">
                    <i class="bi bi-person-plus me-1"></i> Create Student Account
                </button>
            </form>

            <div class="auth-footer">
                <p>Already registered? <a href="/auth/login">Sign in here</a></p>
            </div>
        </div>
    </div>
</div>

<%- include('../partials/footer.html') %>
