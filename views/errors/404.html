<%- include('../partials/header.html') %>
<%- include('../partials/sidebar.html') %>

<div class="main-content">
    <div class="error-container">
        <div class="error-code-404">
            404
        </div>
        <h2 class="error-title">Page Not Found</h2>
        <p class="error-desc">
            The learning resource or path <code><%= typeof url !== 'undefined' ? url : '' %></code> you requested does not exist or has moved.
        </p>
        <div class="error-btn-group">
            <a href="/" class="btn-focus">
                <i class="bi bi-house-door me-1"></i> Return Home
            </a>
            <a href="/courses" class="btn-focus-outline">
                <i class="bi bi-book me-1"></i> Browse Courses
            </a>
        </div>
    </div>
</div>
